spring:
  application:
    name: backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:kimngeam}
    username: ${DB_USER:kimngeam}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

# JWT_SECRET es obligatorio (sin default) y debe tener al menos 32 caracteres
# (HS256 requiere una clave >= 256 bits). Nunca hardcodear este valor.
jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24h — pendiente de confirmar (ver docs/TODO.md, Fase 1)

# Las fuentes del corpus (~240 MB) viven fuera del repo — ver CLAUDE.md,
# "Fuentes de datos del corpus". Default vacío (no obligatorio como JWT_SECRET)
# a propósito: la app debe arrancar igual sin esta variable mientras la
# ingesta esté desactivada; CorpusIngestionRunner exige que venga seteada
# recién al momento de ejecutarse.
kimngeam:
  corpus:
    path: ${KIMNGEAM_CORPUS_PATH:}
    ingestion:
      enabled: ${KIMNGEAM_CORPUS_INGESTION_ENABLED:false}
      batch-size: ${KIMNGEAM_CORPUS_INGESTION_BATCH_SIZE:200}
    retrieval:
      top-n: ${KIMNGEAM_CORPUS_RETRIEVAL_TOP_N:5}
  # Proveedor de embeddings, intercambiable sin tocar código (ver
  # rag/embedding/EmbeddingModelConfig). Default "ollama" para que un clon
  # nuevo del repo levante en desarrollo sin credenciales de OpenRouter.
  embedding:
    provider: ${KIMNGEAM_EMBEDDING_PROVIDER:ollama}
    openrouter:
      base-url: ${KIMNGEAM_EMBEDDING_OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
      # Sin default: nunca un valor literal acá, solo por variable de entorno.
      api-key: ${OPENROUTER_API_KEY:}
      model: ${KIMNGEAM_EMBEDDING_OPENROUTER_MODEL:}
      timeout: ${KIMNGEAM_EMBEDDING_OPENROUTER_TIMEOUT:30s}
      max-retries: ${KIMNGEAM_EMBEDDING_OPENROUTER_MAX_RETRIES:3}
    ollama:
      base-url: ${KIMNGEAM_EMBEDDING_OLLAMA_BASE_URL:http://localhost:11434}
      model: ${KIMNGEAM_EMBEDDING_OLLAMA_MODEL:}
  # Proveedor del LLM de generación, intercambiable sin tocar código (ver
  # rag/generation/TranslationLlmClient). Default "openrouter" — a diferencia
  # de embeddings, acá Ollama no sirve como fallback de desarrollo: un modelo
  # de chat local chico produce mapudungun inutilizable, así que solo
  # obligaría a descargar un modelo sin aportar nada útil. Ollama sigue
  # seleccionable, pero SOLO para testeo local, nunca para producción.
  llm:
    provider: ${KIMNGEAM_LLM_PROVIDER:openrouter}
    openrouter:
      base-url: ${KIMNGEAM_LLM_OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
      # Sin default: nunca un valor literal acá, solo por variable de entorno.
      api-key: ${OPENROUTER_API_KEY:}
      # Default no sensible: el modelo que más se acercó al material validado
      # en la prueba comparativa de Fase 3 (ver docs/TODO.md). Candidatos
      # alternativos: google/gemini-3.1-flash-lite (más rápido) y
      # openai/gpt-5.4-mini (declara incertidumbre explícitamente).
      model: ${KIMNGEAM_LLM_OPENROUTER_MODEL:google/gemini-3.8-flash}
      timeout: ${KIMNGEAM_LLM_OPENROUTER_TIMEOUT:90s}
      max-retries: ${KIMNGEAM_LLM_OPENROUTER_MAX_RETRIES:2}
    ollama:
      base-url: ${KIMNGEAM_LLM_OLLAMA_BASE_URL:http://localhost:11434}
      model: ${KIMNGEAM_LLM_OLLAMA_MODEL:}
      timeout: ${KIMNGEAM_LLM_OLLAMA_TIMEOUT:90s}
      max-retries: ${KIMNGEAM_LLM_OLLAMA_MAX_RETRIES:1}
    # Reintentos si la respuesta del LLM no parsea como el JSON esperado (ver
    # rag/generation/TranslationResponseParser) — nunca se devuelve algo a
    # medias, tras agotarlos falla explícito.
    parsing:
      max-reintentos: ${KIMNGEAM_LLM_PARSING_MAX_REINTENTOS:2}

---
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.kimngeam.backend: DEBUG

---
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    show-sql: false

logging:
  level:
    com.kimngeam.backend: INFO

---
# El bean EmbeddingModel se arma a mano en rag/embedding/EmbeddingModelConfig
# según kimngeam.embedding.provider — estas autoconfiguraciones de Spring AI
# quedan excluidas para que nunca compitan con esa configuración manual ni
# instancien un bean (de chat, embedding, imagen, etc.) por su cuenta.
spring:
  autoconfigure:
    exclude:
      - org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.ollama.autoconfigure.OllamaChatAutoConfiguration
      - org.springframework.ai.model.ollama.autoconfigure.OllamaEmbeddingAutoConfiguration
      - org.springframework.ai.model.ollama.autoconfigure.OllamaApiAutoConfiguration
